<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ville Heikkiniemi">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">

    <title>Centria Edu | Contact</title>
</head>

<body>

    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    centria <span>edu</span>
                </div>

                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#topics">Topics</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>

        <section class="topics" id="contact">
            <div class="container">

                <h2>Contact us</h2>

                <p>Please complete the form below to contact us.</p>

                <form class="card" action="https://httpbin.org/post" method="post">

                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" required>

                    <label for="phone">Phone number (optional)</label>
                    <input type="tel" id="phone" name="phone">

                    <label for="subject">Contact subject</label>
                    <select id="subject" name="subject" required>
                        <option value="">Choose a subject</option>
                        <option value="feedback">Feedback</option>
                        <option value="question">Question</option>
                        <option value="other">Other</option>
                    </select>

                    <fieldset>
                        <legend>Preferred contact method</legend>

                        <input type="radio" id="contact-email"
                               name="contact_method" value="email" required>
                        <label for="contact-email">Email</label>

                        <input type="radio" id="contact-phone"
                               name="contact_method" value="phone">
                        <label for="contact-phone">Phone</label>
                    </fieldset>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>

                    <button type="submit" class="button">Submit</button>

                </form>

            </div>
        </section>

    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Centria Edu</p>
        </div>
    </footer>

</body>
</html>
