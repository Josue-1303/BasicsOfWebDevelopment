<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico">
</head>

<body>
    <header>
        <h1>Registration</h1>
        <p>Personal Portfolio</p>

        <nav>
            <a href="index.html">Home</a>
            <a href="gallery.html">Gallery</a>
            <a href="register.html" class="active">Register</a>
        </nav>
    </header>

    <main>
        <h2>Create an account</h2>
        <p>Register to follow my technology projects and updates.</p>

        <form action="https://httpbin.org/post" method="post">

            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email address</label>
            <input type="email" id="email" name="email" required>

            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   minlength="3" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   minlength="8" required>

            <label for="user-type">User type</label>
            <select id="user-type" name="user_type" required>
                <option value="">Select user type</option>
                <option value="student">Student</option>
                <option value="developer">Developer</option>
                <option value="enthusiast">Technology Enthusiast</option>
            </select>

            <h3>Terms of Use</h3>
            <p>This form is for educational purposes only.
               Do not submit real personal information or passwords.</p>

            <div class="terms">
                <input type="checkbox" id="terms" name="terms"
                       value="accepted" required>
                <label for="terms">I accept the Terms of Use.</label>
            </div>

            <button type="submit">Register</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Josue Morales</p>
    </footer>
</body>
</html>
